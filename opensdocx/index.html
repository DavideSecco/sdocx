<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>OpenSdocx</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <!-- Icon set: inline SVG symbols (no external requests — the app runs under a
         strict CSP). Referenced via <use href="#icon-…">. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="icon-sidebar" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
        <line x1="9" y1="4" x2="9" y2="20" stroke="currentColor" stroke-width="2"/>
      </symbol>
      <symbol id="icon-open" viewBox="0 0 24 24">
        <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      </symbol>
      <symbol id="icon-up" viewBox="0 0 24 24">
        <polyline points="5 15 12 8 19 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="icon-down" viewBox="0 0 24 24">
        <polyline points="5 9 12 16 19 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="icon-zoom-out" viewBox="0 0 24 24">
        <line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
      <symbol id="icon-zoom-in" viewBox="0 0 24 24">
        <line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
      <symbol id="icon-caret" viewBox="0 0 24 24">
        <polyline points="6 9 12 15 18 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="icon-viewmode" viewBox="0 0 24 24">
        <rect x="3" y="5" width="8" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="2"/>
        <rect x="13" y="5" width="8" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="2"/>
      </symbol>
      <symbol id="icon-audio" viewBox="0 0 24 24">
        <path d="M4 9v6h4l5 4V5L8 9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <path d="M16 8a5 5 0 0 1 0 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
      <symbol id="icon-export" viewBox="0 0 24 24">
        <path d="M12 3v12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <polyline points="8 7 12 3 16 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    </svg>

    <header class="toolbar">
      <!-- Left: file + zoom + view-mode -->
      <div class="tb-left">
        <button id="sidebar-btn" class="iconbtn" title="Miniature pagine" disabled>
          <svg class="icon"><use href="#icon-sidebar" /></svg>
        </button>
        <button id="open-btn" class="iconbtn" title="Apri .sdocx">
          <svg class="icon"><use href="#icon-open" /></svg>
        </button>

        <div class="sep"></div>

        <div class="group zoom">
          <button id="zoom-out" class="iconbtn" title="Riduci zoom (Ctrl -)" disabled>
            <svg class="icon"><use href="#icon-zoom-out" /></svg>
          </button>
          <div class="combo">
            <input id="zoom-input" class="numbox zoombox" type="text" inputmode="numeric" value="—" disabled aria-label="Livello di zoom" />
            <button id="zoom-menu-btn" class="iconbtn caret" title="Opzioni zoom" disabled>
              <svg class="icon"><use href="#icon-caret" /></svg>
            </button>
            <div id="zoom-menu" class="menu" hidden>
              <button class="menu-item" data-zoom="fit-width">Adatta larghezza</button>
              <button class="menu-item" data-zoom="fit-page">Adatta pagina</button>
              <div class="menu-sep"></div>
              <button class="menu-item" data-zoom="50">50%</button>
              <button class="menu-item" data-zoom="75">75%</button>
              <button class="menu-item" data-zoom="100">100%</button>
              <button class="menu-item" data-zoom="125">125%</button>
              <button class="menu-item" data-zoom="150">150%</button>
              <button class="menu-item" data-zoom="200">200%</button>
              <button class="menu-item" data-zoom="400">400%</button>
            </div>
          </div>
          <button id="zoom-in" class="iconbtn" title="Aumenta zoom (Ctrl +)" disabled>
            <svg class="icon"><use href="#icon-zoom-in" /></svg>
          </button>
        </div>

        <div class="sep"></div>

        <button id="viewmode-btn" class="iconbtn" title="Pagine affiancate" disabled>
          <svg class="icon"><use href="#icon-viewmode" /></svg>
        </button>
      </div>

      <!-- Centre: page navigation (Okular-style) -->
      <div class="tb-center">
        <div class="group nav">
          <button id="prev-btn" class="iconbtn" title="Pagina precedente" disabled>
            <svg class="icon"><use href="#icon-up" /></svg>
          </button>
          <input id="page-input" class="numbox" type="text" inputmode="numeric" value="—" disabled aria-label="Pagina corrente" />
          <span id="page-count" class="of">/ —</span>
          <button id="next-btn" class="iconbtn" title="Pagina successiva" disabled>
            <svg class="icon"><use href="#icon-down" /></svg>
          </button>
        </div>
      </div>

      <!-- Right: audio + export -->
      <div class="tb-right">
        <button id="audio-btn" class="iconbtn" title="Audio — in arrivo" disabled>
          <svg class="icon"><use href="#icon-audio" /></svg>
        </button>
        <div class="combo">
          <button id="export-btn" class="iconbtn" title="Esporta" disabled>
            <svg class="icon"><use href="#icon-export" /></svg>
          </button>
          <div id="export-menu" class="menu menu-right" hidden>
            <button class="menu-item" disabled>PDF — in arrivo</button>
            <button class="menu-item" disabled>Immagine — in arrivo</button>
            <button class="menu-item" disabled>SVG — in arrivo</button>
          </div>
        </div>
      </div>
    </header>
    <div class="workspace">
      <aside id="thumbs" class="thumbs" hidden aria-label="Miniature pagine"></aside>
      <main id="stage" class="stage">
        <div id="empty" class="empty">Apri un file <code>.sdocx</code> per iniziare</div>
        <div id="doc"></div>
      </main>
    </div>
  </body>
</html>
