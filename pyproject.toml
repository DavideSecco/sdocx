[project]
name = "sdocx"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
# Rendering (pysdocx.render + `python -m pysdocx render`). The core parser needs none of these.
render = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pillow>=11",
    # Rasterises embedded PDF-backed templates (Academic multi-page / imported PDF) as page
    # backgrounds. pdfium — the same engine the Rust/Tauri app targets. Optional at runtime:
    # without it the renderer just omits the PDF background (rasterize_pdf_page returns None).
    "pypdfium2>=5",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "kaitaistruct>=0.11",  # runtime for the vendored spec/generated/ Kaitai parsers (test gate)
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pillow>=11",
    "pypdfium2>=5",
    "ruff>=0.15.5",
]
